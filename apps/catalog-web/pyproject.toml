[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "makersfridge-web"
version = "1.4.0"
description = "Visual browser and parts-list manager for Maker's Fridge"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.4,<4.10",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<0.116",
  "jinja2>=3.1,<4",
  "makersfridge",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
standalone = ["pyinstaller>=6.11,<7"]

[project.scripts]
makersfridge-web = "makersfridge_web.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/makersfridge_web"]

[tool.uv.sources]
makersfridge = { workspace = true }
