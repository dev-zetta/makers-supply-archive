services:
  catalog-web:
    build:
      context: ../..
      dockerfile: apps/catalog-web/Dockerfile
    restart: unless-stopped
    environment:
      MAKERSFRIDGE_ROOT: /archive
      MAKERSFRIDGE_CATALOG_DB: /archive/dist/makersfridge.sqlite
      MAKERSFRIDGE_STATE_DB: /state/catalog-web.sqlite
      MAKERSFRIDGE_SECRET_KEY: ${MAKERSFRIDGE_SECRET_KEY:-${MAKERS_SUPPLY_SECRET_KEY:?set a long random secret}}
      MAKERSFRIDGE_SECURE_COOKIES: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../..:/archive:ro
      - catalog-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  catalog-state:
