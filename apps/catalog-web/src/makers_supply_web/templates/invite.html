{% extends "base.html" %}
{% block title %}Accept invitation{% endblock %}
{% block content %}
<h1>Create your account</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <label>Username <input name="username" minlength="3" required autocomplete="username"></label>
  <label>Password <input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
  <button type="submit">Create account</button>
</form>
{% endblock %}
