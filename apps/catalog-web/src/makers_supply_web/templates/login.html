{% extends "base.html" %}
{% block title %}Sign in · Maker's Supply Catalog{% endblock %}
{% block content %}
<h1>Maker's Supply Catalog</h1>
<p class="muted">Sign in to browse hardware and manage parts lists.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <label>Username <input name="username" required autocomplete="username"></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
  <label class="checkbox-label"><input name="remember_me" type="checkbox" value="true"> <span><strong>Remember me</strong><small>Keep me signed in on this device for 30 days.</small></span></label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
