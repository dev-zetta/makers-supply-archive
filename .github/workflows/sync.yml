name: Weekly catalog sync

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Skip binary asset downloads
        type: boolean
        default: false
      max_products:
        description: Optional per-region product limit for smoke runs
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: makers-supply-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BRANCH_NAME: automation/catalog-sync
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --all-packages --extra dev
      - name: Synchronize
        shell: bash
        run: |
          args=(--resume)
          if [[ "${{ inputs.metadata_only }}" == "true" ]]; then args+=(--metadata-only); fi
          if [[ -n "${{ inputs.max_products }}" ]]; then args+=(--max-products "${{ inputs.max_products }}"); fi
          uv run makers-supply sync "${args[@]}"
      - name: Verify generated data
        run: |
          uv run makers-supply validate
          uv run makers-supply lfs-preflight
          uv run pytest
      - name: Create update branch and pull request
        shell: bash
        run: |
          git config user.name "makers-supply-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add data reports
          if git diff --cached --quiet; then echo "No catalog changes"; exit 0; fi
          git commit -m "data: update makers supply archive"
          git push --force-with-lease origin "$BRANCH_NAME"
          if gh pr view "$BRANCH_NAME" >/dev/null 2>&1; then
            gh pr edit "$BRANCH_NAME" --body-file reports/latest.md
          else
            gh pr create --base main --head "$BRANCH_NAME" \
              --title "data: weekly Maker's Supply catalog update" \
              --body-file reports/latest.md
          fi
