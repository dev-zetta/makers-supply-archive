name: Publish catalog database

on:
  push:
    branches: [main]
    paths:
      - "data/products/**"
      - "src/makers_supply/database.py"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SQLite database
        run: |
          python -m pip install uv
          uv sync --all-packages
          uv run makers-supply build-db
          sha256sum dist/makers-supply.sqlite > dist/makers-supply.sqlite.sha256
      - name: Publish dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="catalog-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          gh release create "$tag" dist/makers-supply.sqlite dist/makers-supply.sqlite.sha256 \
            --title "$tag" --generate-notes
