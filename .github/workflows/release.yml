name: Prepare unpublished release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching all package metadata (without v)
        type: string
        default: "1.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tested:
    uses: ./.github/workflows/standalone.yml
    with:
      release_candidate: true
  draft:
    needs: tested
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install uv==0.8.14
          uv sync --frozen --all-packages
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-data
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: dist/evidence
      - name: Package portable agent skills
        run: uv run python scripts/build-agent-skills.py --output dist/release
      - name: Create checked draft (never publishes)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/prepare-draft.py --directory dist/release --evidence dist/evidence
