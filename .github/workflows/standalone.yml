name: Intel graphics diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: |
          npm --prefix apps/catalog-desktop ci
          npm --prefix apps/catalog-web/frontend ci
      - name: Probe sandboxed renderer backends
        run: |
          mkdir -p .staging
          cat > .staging/probe-main.cjs <<'JS'
          const {app,BrowserWindow}=require('electron');
          app.whenReady().then(async()=>{
            const window=new BrowserWindow({show:true,webPreferences:{sandbox:true,contextIsolation:true,nodeIntegration:false}});
            await window.loadURL('data:text/html,<html><body>Graphics probe</body></html>');
          });
          app.on('window-all-closed',()=>app.quit());
          JS
          cat > .staging/probe.cjs <<'JS'
          const {_electron}=require('../apps/catalog-web/frontend/node_modules/playwright');
          const path=require('node:path');
          const fs=require('node:fs');
          (async()=>{
            for (const backend of ['default','metal','gl','swiftshader','metal-ignore-blocklist']) {
              let app, child;
              try {
                const flags=backend==='default'?[]:['--use-gl=angle','--use-angle='+backend.replace('-ignore-blocklist','')];
                if(backend.endsWith('ignore-blocklist')) flags.push('--ignore-gpu-blocklist');
                app=await _electron.launch({
                  executablePath:path.resolve('apps/catalog-desktop/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron'),
                  args:[path.resolve('.staging/probe-main.cjs'),...flags],
                  chromiumSandbox:true,timeout:45000
                });
                child=app.process();
                child.stdout.on('data',x=>process.stdout.write(x));
                child.stderr.on('data',x=>process.stderr.write(x));
                const page=await app.firstWindow({timeout:30000});
                const context=await page.evaluate(()=>{
                  const gl=document.createElement('canvas').getContext('webgl2');
                  if(!gl) return null;
                  const ext=gl.getExtension('WEBGL_debug_renderer_info');
                  return {version:gl.getParameter(gl.VERSION),renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):null};
                });
                const gpu=await app.evaluate(async({app})=>({status:app.getGPUFeatureStatus(),info:await app.getGPUInfo('basic'),sandboxDisabled:app.commandLine.hasSwitch('no-sandbox')}));
                console.log(JSON.stringify({backend,context,gpu}));
              } catch(error){ console.error('PROBE ERROR',backend,error); }
              finally {
                if(app) await Promise.race([app.close().catch(()=>{}),new Promise(r=>setTimeout(r,5000))]);
                if(child?.exitCode===null) child.kill('SIGKILL');
              }
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
          node .staging/probe.cjs
