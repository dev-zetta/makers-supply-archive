name: Build standalone local apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: apps/catalog-desktop/package-lock.json
      - name: Install uv
        run: python -m pip install uv
      - name: Install standalone build dependencies
        run: |
          uv sync --package makers-supply-web --extra standalone
          npm --prefix apps/catalog-desktop ci
      - name: Build portable app
        run: >-
          uv run --package makers-supply-web --extra standalone
          python scripts/build-standalone.py
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: makers-supply-catalog-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/standalone/makers-supply-catalog-*.tar.gz
            dist/standalone/makers-supply-catalog-*.zip
          compression-level: 0
          if-no-files-found: error
