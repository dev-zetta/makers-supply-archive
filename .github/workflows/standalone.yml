name: Build and test standalone apps

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_candidate:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/test.yml
    with:
      build_data_packs: true
      require_release_evidence: ${{ inputs.release_candidate || false }}
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: |
            apps/catalog-desktop/package-lock.json
            apps/catalog-web/frontend/package-lock.json
      - name: Install locked build dependencies
        run: |
          python -m pip install uv==0.8.14
          uv sync --frozen --all-packages --extra standalone
          npm --prefix apps/catalog-desktop ci
          npm --prefix apps/catalog-web/frontend ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-data
          path: dist/data-packs
      - name: Build app without copying shared assets
        run: >-
          uv run --package makers-supply-web --extra standalone
          python scripts/build-standalone.py --layout split --revision ${{ github.sha }}
      - name: Test delivered archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive=$(find dist/standalone -maxdepth 1 -name '*.tar.gz' -print -quit)
          xvfb-run -a uv run python scripts/check-desktop.py --app-archive "$archive" --packs dist/data-packs
      - name: Test delivered archive (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          archive=$(find dist/standalone -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          uv run python scripts/check-desktop.py --app-archive "$archive" --packs dist/data-packs
      - name: Upload tested app
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            dist/standalone/makers-supply-catalog-*.tar.gz
            dist/standalone/makers-supply-catalog-*.zip
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}
          path: apps/catalog-web/frontend/test-results/desktop/
          retention-days: 3
          if-no-files-found: ignore
