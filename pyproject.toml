[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "makers-supply-archive"
version = "1.0.0"
description = "A versioned archive of Bambu Lab Maker's Supply metadata and design assets"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Maker's Supply Archive contributors" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<0.29",
  "pillow>=11.3,<13",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-httpx>=0.30,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
makers-supply = "makers_supply.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/makers_supply"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["makers_supply"]

[tool.uv.workspace]
members = ["apps/catalog-web"]
